[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "depbee"
version = "0.1.0"
description = "CLI integration for context-aware npm update detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = ["lightgbm>=4.6,<5", "numpy>=1.26,<3"]
dev = ["ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
depbee = "depbee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
