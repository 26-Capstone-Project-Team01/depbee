[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "depbee"
version = "0.1.0"
description = "CLI integration for context-aware npm update detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = ["lightgbm>=4.6,<5", "numpy>=1.26,<3"]
# Private team repository; installing it needs GitHub access. Pinned to a reviewed commit.
extract = [
    "depbee-analyzer @ git+https://github.com/26-Capstone-Project-Team01/depbee-analyzer@a83cc4b159b5458899cdf0546454dfc0161c9d05",
]
# httpx2: the Starlette TestClient of the dashboard tests.
dev = ["ruff>=0.12,<1", "build>=1.2,<2", "httpx2>=2.16,<3"]
# Read-only MCP entry point (depbee mcp); the depbee package itself never imports it.
mcp = ["mcp>=2.3,<3"]
# Local history dashboard (depbee dashboard); only depbee.dashboard.app imports these.
web = ["starlette>=1.10,<2", "jinja2>=3.1.6,<4", "uvicorn>=0.54,<0.55"]

[project.scripts]
depbee = "depbee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The dashboard's pages and stylesheet; include-package-data alone takes only MANIFEST.in files.
[tool.setuptools.package-data]
"depbee.dashboard" = ["templates/*.html", "static/*.css"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
