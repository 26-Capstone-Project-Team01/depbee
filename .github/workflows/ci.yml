name: CLI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # Exercise the package data that users actually install on each supported OS.
      - run: python -m pip install ".[dev,mcp,web]"
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m build

  # This job exercises the reporting policy without installing the private analyzer.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Gate exit codes, expected failures included
        shell: bash
        # Output goes to a file: annotations of the expected failures must not show on this run.
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/expected-summary.md"
          log="$RUNNER_TEMP/expected.log"
          run() { python -I src/depbee/actions.py "$@" >> "$log"; }
          gate() {
            run report "docs/examples/result-contract/$1" --self-test --fail-on "$2" \
              --lockfile examples/project/package-lock.json
          }
          fails() { if "$@"; then echo "Expected a failure: $*"; exit 1; fi; }
          gate 01-rule-only.json 'ml-hit,incomplete'
          gate 02-ml-only.json ''
          fails gate 02-ml-only.json ml-hit
          gate 04-analysis-failed.json ml-hit
          fails gate 04-analysis-failed.json incomplete
          fails gate 03-known-malicious-low-ml.json ''
          fails gate missing.json ''
          fails gate 01-rule-only.json unknown
          # Lockfile paths Linux dirname would read differently from the input check (review F1).
          lock() { LOCKFILE="$1" REPORT=docs/examples/result-contract/01-rule-only.json run inputs; }
          lock examples/project/package-lock.json
          fails lock 'examples\project\package-lock.json'
          fails lock -examples/project/package-lock.json
          # A real LF, which $(dirname ...) would trim off a folder name (review F2).
          fails lock $'examples/project\n/package-lock.json'
          printf 'synthetic' > "$RUNNER_TEMP/model.txt"
          fails run verify "$RUNNER_TEMP/model.txt" "$(printf '0%.0s' $(seq 64))"
          run verify "$RUNNER_TEMP/model.txt" "$(sha256sum "$RUNNER_TEMP/model.txt" | cut -d' ' -f1)"
          # A scan's report must name its model and known malicious list (05 names no list);
          # only the self-test judges one that does not.
          fails run report docs/examples/result-contract/05-detectors-not-configured.json \
            --lockfile examples/project/package-lock.json
          gate 05-detectors-not-configured.json ''
          # Release inputs: none (the assets inside the installed depbee) or all five. Some of
          # them, a malformed one or no pull request base commit fail the input check.
          export GITHUB_OUTPUT="$RUNNER_TEMP/expected-output.txt"
          export LOCKFILE=examples/project/package-lock.json MAX_CHANGES=20
          export BASE_SHA="$(printf 'c%.0s' $(seq 40))"
          sha="$(printf 'a%.0s' $(seq 64))"
          release() {
            MODEL_VERSION="$1" MODEL_SHA256="$sha" MANIFEST_SHA256="$sha" \
              KNOWN_MALICIOUS_VERSION=index-1 KNOWN_MALICIOUS_SHA256="$2" run inputs
          }
          run inputs
          grep -qx 'assets=bundled' "$GITHUB_OUTPUT"
          release model-1 "$sha"
          grep -qx "identity=$sha" "$GITHUB_OUTPUT"
          fails release model-1 ''
          fails release '' "$sha"
          fails release model-1 "${sha}0"
          BASE_SHA=main fails run inputs
          echo "All expected exit codes"
      - name: Scan the example with installed assets
        shell: bash
        run: |
          python -m pip install .
          status=0
          depbee scan examples/project --base-lock examples/baseline/package-lock.json \
            --output bundled-report.json > /dev/null || status=$?
          test "$status" -eq 2  # One changed package, no extracted features.
          python -I - <<'PY'
          import json
          from importlib.resources import files
          from pathlib import Path
          assets = files("depbee") / "assets"
          model = json.loads((assets / "model" / "manifest.json").read_bytes())
          index = json.loads((assets / "index" / "manifest.json").read_bytes())
          report = json.loads(Path("bundled-report.json").read_bytes())
          assert report["model_id"] == model["model_id"]
          assert report["provenance"]["model"]["model_sha256"] == model["model_sha256"]
          known = report["detectors"]["known_malicious"]
          assert (known["list_as_of"], known["list_sha256"]) == (index["list_as_of"], index["index_sha256"])
          assert [r["known_malicious"]["status"] for r in report["results"]] == ["not_hit"]
          PY
          GITHUB_STEP_SUMMARY="$RUNNER_TEMP/bundled-gate.md" python -I src/depbee/actions.py \
            report bundled-report.json --lockfile examples/project/package-lock.json > /dev/null
      # Publish the installed wheel's report and both asset identities in the job summary.
      - uses: ./
        with:
          lockfile: examples/project/package-lock.json
          report: bundled-report.json

  # The public image stage: the wheel with the CLI, the MCP server and the dashboard, without the
  # private analyzer. Built with no credentials and never pushed, then run the way it is used:
  # its own entrypoint and user, no network, a read-only root and only the synthetic examples
  # mounted.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the public stage, whose own user is not root
        shell: bash
        run: |
          docker build --target core -t depbee:ci .
          user="$(docker image inspect --format '{{.Config.User}}' depbee:ci)"
          case "${user%%:*}" in '' | 0 | root) echo "depbee:ci runs as root"; exit 1 ;; esac
      - name: Scan the example offline with the image's model and index
        shell: bash
        run: |
          status=0
          docker run --rm --network none --read-only --tmpfs /tmp \
            --mount "type=bind,source=$PWD/examples/project,target=/project,readonly" \
            --mount "type=bind,source=$PWD/examples/baseline,target=/baseline,readonly" \
            depbee:ci scan /project --base-lock /baseline/package-lock.json --format json \
            > docker-report.json || status=$?
          cat docker-report.json
          test "$status" -eq 2  # One changed package, no extracted features: held, not passed.
          python3 -I - <<'PY'
          import json
          from pathlib import Path
          assets = Path("src/depbee/assets")
          model = json.loads((assets / "model" / "manifest.json").read_bytes())
          index = json.loads((assets / "index" / "manifest.json").read_bytes())
          report = json.loads(Path("docker-report.json").read_bytes())
          assert (report["status"], report["exit_code"]) == ("incomplete", 2)
          # A report names them only after LightGBM loaded that model and the index was read.
          assert report["model_id"] == model["model_id"]
          assert report["provenance"]["model"]["model_sha256"] == model["model_sha256"]
          known = report["detectors"]["known_malicious"]
          assert (known["list_as_of"], known["list_sha256"]) == (index["list_as_of"], index["index_sha256"])
          (row,) = report["results"]
          assert (row["package"], row["after_version"]) == ("example-package", "1.1.0")
          assert (row["status"], row["reason"]) == ("incomplete", "analysis_missing")
          assert (row["ml"]["status"], row["known_malicious"]["status"]) == ("not_run", "not_hit")
          PY
      # The default base: no --base-lock and no --base-ref, so the image's Git reads HEAD of an
      # ordinary repository that the runner's user owns, allowed by safe.directory /project alone.
      - name: Plan against Git HEAD in a project another user owns
        shell: bash
        run: |
          project="$(mktemp -d "$RUNNER_TEMP/git-project.XXXXXX")"
          cp examples/baseline/package-lock.json "$project/package-lock.json"
          git init --quiet --initial-branch=main "$project"
          git -C "$project" add package-lock.json
          git -C "$project" -c user.name=depbee-ci -c user.email=depbee-ci@example.invalid \
            -c core.hooksPath=/dev/null commit --quiet -m baseline
          # From here the baseline is in HEAD only: the working file is the changed lockfile.
          cp examples/project/package-lock.json "$project/package-lock.json"
          # mktemp made the folder 0700, and the image's user reads it as "other".
          chmod -R a+rX "$project"
          # The dashboard steps below mount the same project under /projects.
          echo "GIT_PROJECT=$project" >> "$GITHUB_ENV"
          owner="$(stat -c %u "$project")"
          image_user="$(docker image inspect --format '{{.Config.User}}' depbee:ci)"
          echo "fixture owner UID $owner, image user $image_user"
          test "$owner" -ne "${image_user%%:*}"  # Fails on a user name too: the image names its UID.
          docker run --rm --network none --read-only --tmpfs /tmp \
            --mount "type=bind,source=$project,target=/project,readonly" \
            depbee:ci plan /project > docker-plan.json
          cat docker-plan.json
          python3 -I - <<'PY'
          import json
          from pathlib import Path
          (change,) = json.loads(Path("docker-plan.json").read_bytes())["changes"]
          assert (change["location"], change["kind"]) == ("node_modules/example-package", "updated")
          before, after = change["before"], change["after"]
          assert (before["name"], before["version"]) == ("example-package", "1.0.0")  # Git HEAD
          assert (after["name"], after["version"]) == ("example-package", "1.1.0")  # working file
          PY
      - name: Initialize the MCP server and list its tools over stdio
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json
          import subprocess
          # stdin stays open until the last answer is read, as an agent keeps it. timeout ends a
          # server that hangs: its stdout then ends without the answer, which fails here.
          server = subprocess.Popen(
              ["timeout", "--signal=KILL", "60", "docker", "run", "--rm", "-i", "--network", "none",
               "--read-only", "--tmpfs", "/tmp", "depbee:ci", "mcp"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)

          def send(**message):
              server.stdin.write(json.dumps({"jsonrpc": "2.0", **message}) + "\n")
              server.stdin.flush()

          def call(request_id, method, params):
              """Send one request, then read up to the answer with its id and return the result."""
              send(id=request_id, method=method, params=params)
              for line in server.stdout:  # JSON-RPC only: the server's log goes to stderr.
                  answer = json.loads(line)
                  if "method" not in answer and answer.get("id") == request_id:
                      print(answer)
                      assert answer["jsonrpc"] == "2.0"
                      return answer["result"]
              raise SystemExit(f"The server ended without an answer to {method}")

          version = "2025-06-18"
          result = call(1, "initialize", {"protocolVersion": version, "capabilities": {},
                                          "clientInfo": {"name": "depbee-ci", "version": "0"}})
          assert result["protocolVersion"] == version
          assert result["serverInfo"]["name"] == "depbee"
          assert "tools" in result["capabilities"]
          # A notification (no id, no answer) ends the handshake; only then are the tools listed.
          send(method="notifications/initialized")
          tools = call(2, "tools/list", {})["tools"]
          assert sorted(tool["name"] for tool in tools) == ["check_package", "scan_lockfile"]
          server.stdin.close()
          assert server.wait() == 0  # The server ends when its client closes stdin.
          PY
      # The dashboard as docs/docker.md starts it: the image's own port, published on the runner's
      # 127.0.0.1 alone under the same number, the Git project of the step above mounted read-only
      # under /projects, and a volume for the home folder. What the pages do is tested in tests/;
      # this is the image: the web extra, the templates, where it listens, the address it prints,
      # the folder it registers from, the Git it reads that folder's HEAD with, and the volume a
      # second container, made anew from the image, knows the registered project from.
      - name: Open the dashboard through a port published on 127.0.0.1, then in a new container
        shell: bash
        run: |
          docker volume rm --force depbee-ci-home > /dev/null  # the checks below start it empty
          python3 -I - <<'PY'
          import http.client
          import os
          import re
          import subprocess
          import time
          from urllib.parse import urlencode

          def docker(*arguments, check=True):
              done = subprocess.run(["docker", *arguments], check=check, capture_output=True, text=True)
              return done.stdout

          def started(name):
              """A container started as docs/docker.md says: (the path of its address, its
              session). The address line is never echoed: it is a secret."""
              project = f"type=bind,source={os.environ['GIT_PROJECT']},target=/projects/example,readonly"
              docker("run", "--rm", "-d", "--name", name, "-p", "127.0.0.1:5757:5757",
                     "--mount", project, "--mount", "type=volume,source=depbee-ci-home,target=/home/depbee",
                     "depbee:ci", "dashboard")
              for _ in range(120):
                  for line in docker("logs", name).splitlines():
                      if line.startswith("http://"):
                          address = re.fullmatch(r"http://127\.0\.0\.1:5757(/s/([A-Za-z0-9_-]{43}))/", line)
                          assert address, "not this host's 127.0.0.1 at the published port with a session"
                          return address[1], address[2]
                  time.sleep(0.5)
              raise SystemExit("The dashboard printed no address")

          def call(method, url, host="127.0.0.1:5757", **form):
              """(status, Location, body) of one request to the published port."""
              body = urlencode({"session": session, **form}) if method == "POST" else None
              headers = {"Host": host}
              if body:
                  headers |= {"Origin": "http://127.0.0.1:5757",
                              "Content-Type": "application/x-www-form-urlencoded"}
              connection = http.client.HTTPConnection("127.0.0.1", 5757, timeout=30)
              connection.request(method, url, body, headers)
              response = connection.getresponse()
              return response.status, response.getheader("location"), response.read().decode()

          def links():
              """The project links on the session's first page, which lists what is registered."""
              status, _, page = call("GET", base + "/")
              assert status == 200, status
              return set(re.findall(rf'href="({re.escape(base)}/projects/\d+)"', page))

          def usable(link):
              """The project behind its link: its page lists the lockfile's package, and a scan
              of it reads HEAD's lockfile under /projects and stops at the analyzer alone, which
              this stage leaves out (the error names the extra that brings it)."""
              status, _, page = call("GET", link)
              assert status == 200 and "example-package" in page, status
              status, _, page = call("POST", link + "/scans")
              assert status == 400 and "[extract]" in page, status

          def register():
              """Register the example and return its project link. Which page that lands on is
              the pages' own business, the overview (as for the first project of all) or the
              project itself: its link is read from the first page, never assumed."""
              status, landed, _ = call("POST", base + "/projects", path="/projects/example")
              (link,) = links()
              assert status == 303 and landed in (base + "/", link), (status, landed)
              return link

          try:
              base, session = started("depbee-dashboard")
              status, _, page = call("GET", base + "/")
              assert status == 200 and f'action="{base}/projects/pick"' in page, status
              assert links() == set()  # a new volume knows no project
              assert call("GET", base + "/", host="localhost:5757")[0] == 400
              assert call("GET", "/s/" + "A" * 43 + "/")[0] == 403
              # The folder button leads to the mounted folders, which offer the example alone.
              assert call("POST", base + "/projects/pick")[:2] == (303, base + "/projects/mounted")
              status, _, page = call("GET", base + "/projects/mounted")
              assert status == 200, status
              assert re.findall(r'name="path" value="([^"]*)"', page) == ["/projects/example"], page
              assert call("GET", base + "/projects/mounted?at=..")[0] == 404
              for outside in ("/project", "/etc", "/home/depbee", "/projects/../etc"):
                  assert call("POST", base + "/projects", path=outside)[0] == 400, outside
              usable(register())
              print("The dashboard answered on 127.0.0.1:5757 and registered /projects/example alone")

              # --rm: the first container goes with all it wrote outside the volume, and the
              # next one has only the volume to know the project from.
              docker("stop", "depbee-dashboard")
              first = base
              base, session = started("depbee-dashboard-again")
              assert base != first  # each container prints an address of its own
              (link,) = links()
              usable(link)
              # The same folder is still that project: registering it again adds no second one.
              assert register() == link
              print("A new container read the registered project from the home volume")
          finally:
              docker("rm", "--force", "depbee-dashboard", "depbee-dashboard-again", check=False)
          PY
      # The npm the image ships for the update check, run as depbee runs it (inputs.npm_cli):
      # node with the npm-cli.js copied next to it, and no npm command on PATH. A scratch project
      # without dependencies needs no registry, so this runs offline like the scans above. The
      # check that follows an update needs the private analyzer, which this stage leaves out
      # (docs/ci-cd.md).
      - name: Run the bundled npm offline, as an update check does
        shell: bash
        run: |
          docker run --rm -i --network none --read-only --tmpfs /tmp \
            --entrypoint python depbee:ci -I - <<'PY'
          import json
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          from depbee.inputs import npm_cli

          assert shutil.which("npm") is None and shutil.which("npx") is None
          node = subprocess.run(["node", "--version"], capture_output=True, text=True, check=True)
          work = Path(tempfile.mkdtemp()) / "project"
          work.mkdir()
          root = {"name": "synthetic-example-only", "version": "1.0.0"}
          (work / "package.json").write_text(json.dumps(root))
          lock = {**root, "lockfileVersion": 3, "packages": {"": root}}
          (work / "package-lock.json").write_text(json.dumps(lock))
          npm = npm_cli.update_lock(work, [])  # npm --version, then the lock-only update
          written = json.loads((work / "package-lock.json").read_bytes())
          print(node.stdout.strip(), npm, written)
          # The versions docs/docker.md names, and a lockfile that npm itself wrote.
          assert (node.stdout.strip(), npm) == ("v24.11.0", "11.6.1")
          assert written == {**lock, "requires": True}
          PY
