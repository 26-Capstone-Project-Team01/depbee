name: CLI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # Exercise the package data that users actually install on each supported OS.
      - run: python -m pip install ".[dev,mcp,web]"
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m build

  # This job exercises the reporting policy without installing the private analyzer.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Gate exit codes, expected failures included
        shell: bash
        # Output goes to a file: annotations of the expected failures must not show on this run.
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/expected-summary.md"
          log="$RUNNER_TEMP/expected.log"
          run() { python -I src/depbee/actions.py "$@" >> "$log"; }
          gate() {
            run report "docs/examples/result-contract/$1" --self-test --fail-on "$2" \
              --lockfile examples/project/package-lock.json
          }
          fails() { if "$@"; then echo "Expected a failure: $*"; exit 1; fi; }
          gate 01-rule-only.json 'ml-hit,incomplete'
          gate 02-ml-only.json ''
          fails gate 02-ml-only.json ml-hit
          gate 04-analysis-failed.json ml-hit
          fails gate 04-analysis-failed.json incomplete
          fails gate 03-known-malicious-low-ml.json ''
          fails gate missing.json ''
          fails gate 01-rule-only.json unknown
          # Lockfile paths Linux dirname would read differently from the input check (review F1).
          lock() { LOCKFILE="$1" REPORT=docs/examples/result-contract/01-rule-only.json run inputs; }
          lock examples/project/package-lock.json
          fails lock 'examples\project\package-lock.json'
          fails lock -examples/project/package-lock.json
          # A real LF, which $(dirname ...) would trim off a folder name (review F2).
          fails lock $'examples/project\n/package-lock.json'
          printf 'synthetic' > "$RUNNER_TEMP/model.txt"
          fails run verify "$RUNNER_TEMP/model.txt" "$(printf '0%.0s' $(seq 64))"
          run verify "$RUNNER_TEMP/model.txt" "$(sha256sum "$RUNNER_TEMP/model.txt" | cut -d' ' -f1)"
          # A scan's report must name its model and known malicious list (05 names no list);
          # only the self-test judges one that does not.
          fails run report docs/examples/result-contract/05-detectors-not-configured.json \
            --lockfile examples/project/package-lock.json
          gate 05-detectors-not-configured.json ''
          # Release inputs: none (the assets inside the installed depbee) or all five. Some of
          # them, a malformed one or no pull request base commit fail the input check.
          export GITHUB_OUTPUT="$RUNNER_TEMP/expected-output.txt"
          export LOCKFILE=examples/project/package-lock.json MAX_CHANGES=20
          export BASE_SHA="$(printf 'c%.0s' $(seq 40))"
          sha="$(printf 'a%.0s' $(seq 64))"
          release() {
            MODEL_VERSION="$1" MODEL_SHA256="$sha" MANIFEST_SHA256="$sha" \
              KNOWN_MALICIOUS_VERSION=index-1 KNOWN_MALICIOUS_SHA256="$2" run inputs
          }
          run inputs
          grep -qx 'assets=bundled' "$GITHUB_OUTPUT"
          release model-1 "$sha"
          grep -qx "identity=$sha" "$GITHUB_OUTPUT"
          fails release model-1 ''
          fails release '' "$sha"
          fails release model-1 "${sha}0"
          BASE_SHA=main fails run inputs
          echo "All expected exit codes"
      - name: Scan the example with installed assets
        shell: bash
        run: |
          python -m pip install .
          status=0
          depbee scan examples/project --base-lock examples/baseline/package-lock.json \
            --output bundled-report.json > /dev/null || status=$?
          test "$status" -eq 2  # One changed package, no extracted features.
          python -I - <<'PY'
          import json
          from importlib.resources import files
          from pathlib import Path
          assets = files("depbee") / "assets"
          model = json.loads((assets / "model" / "manifest.json").read_bytes())
          index = json.loads((assets / "index" / "manifest.json").read_bytes())
          report = json.loads(Path("bundled-report.json").read_bytes())
          assert report["model_id"] == model["model_id"]
          assert report["provenance"]["model"]["model_sha256"] == model["model_sha256"]
          known = report["detectors"]["known_malicious"]
          assert (known["list_as_of"], known["list_sha256"]) == (index["list_as_of"], index["index_sha256"])
          assert [r["known_malicious"]["status"] for r in report["results"]] == ["not_hit"]
          PY
          GITHUB_STEP_SUMMARY="$RUNNER_TEMP/bundled-gate.md" python -I src/depbee/actions.py \
            report bundled-report.json --lockfile examples/project/package-lock.json > /dev/null
      # Publish the installed wheel's report and both asset identities in the job summary.
      - uses: ./
        with:
          lockfile: examples/project/package-lock.json
          report: bundled-report.json
